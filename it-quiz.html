h+='<button class="cat'+(k==4?' wide':'')+'" data-k="'+k+'"><div class="e">'+c.e+'</div><b>'+c[L]+'</b><small>'+n+' '+t.q+(b?' · '+t.best+': '+b:'')+'</small></button>'});
$('app').innerHTML=h+'</div>';
document.querySelectorAll('.cat').forEach(function(b){b.onclick=function(){start(+b.dataset.k)}})}
function start(k){ques.last=-1;cat=k;qs=k==4?sh(Q).slice(0,10):sh(Q.filter(function(q){return q.c==k}));i=0;score=0;streak=0;okc=0;wrong=[];ques()}
function ques(){
scr='q';ans=false;left=20;var q=qs[i],o=opts(q);
if(!ord.length||ord.length!=o.length||ques.last!=i){ord=sh(o.map(function(_,k){return k}));ques.last=i}
paint();clearInterval(tm);
tm=setInterval(function(){left-=.1;var b=$('tb');if(b){b.style.width=Math.max(0,left/20*100)+'%';b.parentNode.className='bar t'+(left<6?' low':'')}
if(left<=0){clearInterval(tm);pick(-1)}},100)}
function paint(){
var t=T[L],q=qs[i],o=opts(q),h='<div class="top"><span>'+(i+1)+' / '+qs.length+'</span><span>'+(streak>1?'🔥'+streak+' · ':'')+score+' '+t.pts+'</span></div>';
h+='<div class="bar"><i style="width:'+(i/qs.length*100)+'%"></i></div><div class="bar t"><i id="tb" style="width:'+(left/20*100)+'%"></i></div>';
h+='<div class="q"><h2>'+esc(q.t[L])+'</h2><div id="os">';
ord.forEach(function(k,n){h+='<button class="opt" data-k="'+k+'"><span class="k">'+'ABCD'.charAt(n)+'</span><span>'+esc(o[k])+'</span></button>'});
$('app').innerHTML=h+'</div><div id="fb"></div></div>';
document.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){pick(+b.dataset.k)}})}
function pick(k){
if(ans)return;ans=true;clearInterval(tm);var t=T[L],q=qs[i],o=opts(q),good=k==q.a;
document.querySelectorAll('.opt').forEach(function(b){var v=+b.dataset.k;if(v==q.a)b.className='opt ok';else if(v==k)b.className='opt no';b.disabled=true});
var msg='';
if(good){var p=10+Math.round(left);score+=p;streak++;okc++;msg='<p class="c"><b>+'+p+'</b></p>'}
else{streak=0;wrong.push(q);msg='<p class="c">'+(k<0?'⏰ '+t.tm+' ':'')+t.ok+': <b>'+esc(o[q.a])+'</b></p>'}
$('fb').innerHTML=msg+'<button class="btn" id="nx">'+(i+1<qs.length?t.next:t.fin)+'</button>';
$('nx').onclick=function(){i++;if(i<qs.length)ques();else end()}}
function end(re){
scr='end';var t=T[L],r=okc/qs.length,ttl=r>=.9?t.ex:r>=.6?t.mid:t.nb;if(!re)isRec=score>(best[cat]||0);
if(isRec&&!re){best[cat]=score;try{localStorage.setItem('b',JSON.stringify(best))}catch(e){}}
var h='<div class="q c"><div class="mut">'+t.res+' · '+C[cat][L]+'</div><div class="big">'+score+'</div><b>'+okc+' / '+qs.length+' '+t.cor+'</b><p>'+ttl+(isRec?'<br>'+t.rec:'')+'</p></div>';
if(wrong.length){h+='<h3>'+t.err+'</h3>';wrong.forEach(function(q){h+='<div class="rv">'+esc(q.t[L])+'<br><b>✔ '+esc(opts(q)[q.a])+'</b></div>'})}
else h+='<p class="c"><b>'+t.perf+'</b></p>';
$('app').innerHTML=h+'<button class="btn" id="ag">'+t.again+'</button><button class="btn g" id="hm">'+t.home+'</button>';
var bg=document.querySelector('.big');if(bg&&!re&&score>0){var n=0,st=Math.max(1,Math.ceil(score/30));bg.textContent=0;var iv=setInterval(function(){n=Math.min(score,n+st);bg.textContent=n;if(n>=score)clearInterval(iv)},25)}
$('ag').onclick=function(){start(cat)};$('hm').onclick=home}
function render(){$('bk').className=L=='kk'?'on':'';$('br').className=L=='ru'?'on':'';document.documentElement.lang=L;
if(scr=='home')home();else if(scr=='q'){var was=ans;if(was){/* keep answered state simple: restart language view */}paint();if(ans){ans=false;var q=qs[i];document.querySelectorAll('.opt').forEach(function(b){b.disabled=true;if(+b.dataset.k==q.a)b.className='opt ok'});ans=true;$('fb').innerHTML='<button class="btn" id="nx">'+(i+1<qs.length?T[L].next:T[L].fin)+'</button>';$('nx').onclick=function(){i++;if(i<qs.length)ques();else end()}}}
else end(true)}
function setL(l){L=l;try{localStorage.setItem('l',l)}catch(e){}render()}
$('bk').onclick=function(){setL('kk')};$('br').onclick=function(){setL('ru')};$('lg').onclick=home;
render();
</script>
</body>
</html>
